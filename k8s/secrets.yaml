# Example Secret manifest. DO NOT commit real values — generate per-environment.
# Apply with: kubectl apply -f secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: prlab-secrets
  namespace: prlab
type: Opaque
stringData:
  POSTGRES_USER: "prlab"
  POSTGRES_PASSWORD: "REPLACE_ME"
  POSTGRES_DB: "prlab_assets"
  DATABASE_URL: "postgresql://prlab:REPLACE_ME@postgres:5432/prlab_assets"
  JWT_SECRET: "REPLACE_ME_WITH_RANDOM_BYTES"
  GOOGLE_CLIENT_ID: "placeholder"
  GOOGLE_CLIENT_SECRET: "placeholder"
---
apiVersion: v1
kind: Namespace
metadata:
  name: prlab
