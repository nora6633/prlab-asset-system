# TLS-terminating reverse proxy in front of the frontend Service.
# Self-contained: doesn't need an Ingress controller (Docker Desktop K8s
# doesn't ship one). For cloud deploys use k8s/ingress.yaml instead.
#
# Bootstrap the cert Secret separately (cert is NOT in git):
#   openssl req -x509 -nodes -newkey rsa:2048 \
#     -keyout /tmp/tls.key -out /tmp/tls.crt \
#     -days 365 \
#     -subj "/CN=localhost" \
#     -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
#   kubectl -n prlab create secret tls prlab-tls \
#     --cert=/tmp/tls.crt --key=/tmp/tls.key
#   rm /tmp/tls.key /tmp/tls.crt
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-tls-config
  namespace: prlab
data:
  default.conf: |
    # HTTP listener: serves /health for K8s probe, redirects everything else to HTTPS.
    server {
        listen 80 default_server;

        location = /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host:8443$request_uri;
        }
    }

    # HTTPS listener: terminate TLS, reverse-proxy to the existing frontend Service.
    # frontend's nginx already proxies /api -> backend, so we just forward everything.
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location = /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://frontend:80;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-tls
  namespace: prlab
  labels:
    app: nginx-tls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-tls
  template:
    metadata:
      labels:
        app: nginx-tls
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          volumeMounts:
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: tls
          secret:
            secretName: prlab-tls
        - name: config
          configMap:
            name: nginx-tls-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-tls
  namespace: prlab
spec:
  type: LoadBalancer
  selector:
    app: nginx-tls
  ports:
    - name: http
      port: 8088
      targetPort: 80
    - name: https
      port: 8443
      targetPort: 443
