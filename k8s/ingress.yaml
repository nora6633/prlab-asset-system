apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prlab-ingress
  namespace: prlab
  annotations:
    # Adjust controller-specific annotations as needed.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - prlab.example.com
      secretName: prlab-tls
  rules:
    - host: prlab.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
